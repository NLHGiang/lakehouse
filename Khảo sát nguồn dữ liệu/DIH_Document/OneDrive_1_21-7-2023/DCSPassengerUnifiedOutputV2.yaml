swagger: '2.0'
################################################################################
#                              API Information                                 #
################################################################################
info:
  version: &VERSION 2.2.0
  title: Dynamic Intelligence Hub API and Data Models - DCS Passenger
  description: >-
      This document describes the OpenAPI for:
       1. GET for DCS Passenger data
       2. Data models for the information pushed out by Amadeus for DCS Passenger
################################################################################
#                  Host, Base Path, Schemes and Content Types                  #
################################################################################
schemes:
- https
host: airlines.api.amadeus.com
basePath: /v2
consumes:
- application/json
produces:
- application/vnd.amadeus+json
################################################################################
#                                   Parameters                                 #
################################################################################
parameters:
  id:
    name: id
    description: Identifier of a DCS Passenger Record
    required: true
    in: path
    type: string
################################################################################
#                                  Security                                    #
################################################################################
securityDefinitions:
  basicAuth:
    type: basic
    description: HTTP Basic Authentication. Works over `HTTP` and `HTTPS`
################################################################################
#                                    Paths                                     #
################################################################################
paths:
  '/departure-control/processed-dcs-passengers/{id}':
    get:
      tags:
      - DcsPassengerAPIs
      operationId: getPassenger
      summary: Retrieve DCS Passenger by ID (UCI)
      description: Returns the DCS Passenger Record for the ID provided
      consumes: []
      parameters:
      - $ref: '#/parameters/id'
      responses:
        '200':
          description: Successful operation
          schema:
            $ref: '#/definitions/DcsPassengerApiResponse'
        '401':
          description: Unauthorized. Missing credentials in header request.
          schema:
            $ref: '#/definitions/Errors'
        '403':
          description: Forbidden. Authorization refused for the credentials provided.
          schema:
            $ref: '#/definitions/Errors'
        '404':
          description: Passenger with the requested id was not found.
          schema:
            $ref: '#/definitions/Errors'
        '500':
          description: Internal server error / Technical
          schema:
            $ref: '#/definitions/Errors'
      security:
      - basicAuth: []
  '/departure-control/dcs-passenger-feed':
    post:
      tags:
      - Data Push Models
      summary: DCS Passenger Data Push
      description: >-
        Model for the DCS Passenger data push feed.
        Please be aware this is NOT a POST API, rather this explains the format of
        the data pushed out by Amadeus.
      responses:
        '200':
          description: >
          schema:
            $ref: '#/definitions/DcsPassengerPush'
  '/departure-control/dcs-passengers-correlations-feed':
    post:
      tags:
      - Data Push Models
      summary: DCS Passenger Correlations Data Push
      description: >-
        Model for the DCS Passenger correlations data push feed.
        Please be aware this is NOT a POST API, rather this explains the format of
        the data pushed out by Amadeus.
      responses:
        '200':
          description: >
          schema:
            $ref: '#/definitions/DcsPassengerCorrelationsPush'
################################################################################
#                                 Definitions                                  #
################################################################################
definitions:
  ErrorSource:
    properties:
      parameter:
        type: string
        description: The key of the URI path or query parameter that caused the error
      pointer:
        type: string
        description: >-
          A JSON Pointer [RFC6901] to the associated entity in the request body
          that caused this error
      example:
        type: string
        description: A sample input to guide the user when resolving this issue

  Warning:
    required:
    - code
    - title
    properties:
      code:
        type: integer
        description: >-
          A machine-readable error code from the Canned Messages table, that
          will enable the API Consumers code to handle this type of error
      title:
        type: string
        description: >-
          An error title from the Canned Messages table with a 1:1 correspondence
          to the error code. This may be localized
      detail:
        type: string
        description: >-
          An easy-to-read explanation specific to this occurrence of the problem.
          It should give the API consumer an idea of what went wrong and how to
          recover from it. Like the title, this field's value can be localized.
      source:
        $ref: "#/definitions/ErrorSource"
      documentation:
        type: string
        format: url
        description: >-
          A link to a web page or file with further documentation to help the
          API consumer resolve this error

  Error:
    required:
    - status
    - code
    - title
    properties:
      status:
        type: integer
        description: >-
          The [HTTP status code](https://www.iana.org/assignments/http-status-codes/http-status-codes.xhtml)
          of this response. This is present only in terminal errors which cause an unsuccessful response.
          In the case of multiple errors, they must all have the same status.
      code:
        type: integer
        description: >-
          A machine-readable error code from the Amadeus Canned Messages table, that
          will enable the API Consumers code to handle this type of error
      title:
        type: string
        description: >-
          An error title from the Canned Messages table with a 1:1 correspondence
          to the error code. This may be localized.
      detail:
        type: string
        description: >-
          An easy-to-read explanation specific to this occurrence of the problem.
          It should give the API consumer an idea of what went wrong and how to
          recover from it. Like the title, this field's value can be localized.
      source:
        $ref: "#/definitions/ErrorSource"
      documentation:
        type: string
        format: url
        description: A link to a web page or file with further documentation to help the API consumer resolve this error
    example:
      status: 401
      code: 20
      title: "RESTRICTED"
      detail: "Query unauthorised"

  Errors:
    type: object
    properties:
      errors:
        type: array
        items:
          $ref: '#/definitions/Error'

  Meta:
    type: object
    description: Technical information related to the feed
    properties:
      triggerEventLog:
        description: Information related to the initial event that triggered the process
        $ref: '#/definitions/EventLog'
      version:
        description: Version of the JSON feed produced
        type: string
        enum:
        - *VERSION
        example: *VERSION

  DcsPassengerPush:
