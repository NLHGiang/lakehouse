              pnrTravelerId: 'ZAY091-2019-10-05-PT-2'
              pnrAirSegmentId: 'ZAY091-2019-10-05-ST-1'
              pnrTicketingReferenceId: 'ZAY091-2019-10-05-OT-12'
            - ticketCouponId: '1721234509876-2019-10-05-2'
              pnrTravelerId: 'ZAY091-2019-10-05-PT-2'
