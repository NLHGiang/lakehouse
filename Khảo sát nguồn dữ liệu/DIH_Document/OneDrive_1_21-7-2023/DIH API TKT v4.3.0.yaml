        - '2501ADE0000001'
      correlatedData:
        - '2501ADE0000001':
          - emdCouponId: '1722500003207-2018-06-15-1'
            dcsPassengerServiceId: '1000000000B54A31'
            dcsPassengerSegmentDeliveryId: '2401CA5500003OID'
  CorrelationEmdMembership:
